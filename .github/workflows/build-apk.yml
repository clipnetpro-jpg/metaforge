name: 02 - Build APK

on:
  workflow_dispatch:
    inputs:
      run_emulator_test:
        description: 'Run the engine tests in an Android emulator'
        type: boolean
        default: true
      publish_release:
        description: 'Publish a GitHub Release with the signed APK'
        type: boolean
        default: true

permissions:
  contents: write

env:
  EXIFTOOL_VERSION: '13.59'

jobs:
  perl:
    uses: ./.github/workflows/perl-android.yml

  apk:
    needs: perl
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: perl-*
          path: perlout

      - name: Fetch ExifTool
        run: |
          set -euxo pipefail
          # exiftool.org only hosts the current release; the GitHub mirror is versioned.
          curl -fsSL -o exiftool.tar.gz \
            "https://github.com/exiftool/exiftool/archive/refs/tags/${EXIFTOOL_VERSION}.tar.gz"
          tar -xzf exiftool.tar.gz
          mv "exiftool-${EXIFTOOL_VERSION}" exiftool-src
          test -f exiftool-src/exiftool
          test -d exiftool-src/lib/Image/ExifTool

      - name: Assemble native libs and assets
        run: |
          set -euxo pipefail
          JNI=app/src/main/jniLibs
          ASSETS=app/src/main/assets
          mkdir -p "$JNI" "$ASSETS"

          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "$JNI/$abi"
            cp "perlout/perl-$abi/jniLibs/libperl.so" "$JNI/$abi/libperl.so"
          done

          # The staged Perl tree is a flat @INC. Everything in it is
          # architecture independent except these four generated files, so one
          # shared zip plus a tiny per-ABI zip covers all three ABIs.
          ARCH_FILES="Config.pm Config_heavy.pl Config_git.pl Errno.pm"

          BASE=perlout/perl-arm64-v8a/perl5
          test -f "$BASE/POSIX.pm"   # guards against the old broken layout
          test -f "$BASE/strict.pm"

          rm -rf staging && mkdir -p staging/perl5
          cp -a "$BASE/." staging/perl5/
          for f in $ARCH_FILES; do rm -f "staging/perl5/$f"; done
          (cd staging && zip -qr9 "../$ASSETS/perl5.zip" perl5)

          for abi in arm64-v8a armeabi-v7a x86_64; do
            rm -rf archstage && mkdir -p archstage/perl5
            SRC="perlout/perl-$abi/perl5"
            for f in $ARCH_FILES; do
              test -f "$SRC/$f" || { echo "::error::$abi is missing $f"; exit 1; }
              cp "$SRC/$f" archstage/perl5/
            done
            (cd archstage && zip -qr9 "../$ASSETS/perl5-$abi.zip" perl5)
          done

          rm -rf etstage && mkdir -p etstage/exiftool
          cp exiftool-src/exiftool etstage/exiftool/exiftool
          cp -a exiftool-src/lib etstage/exiftool/lib
          find etstage -name '*.pod' -delete
          (cd etstage && zip -qr9 "../$ASSETS/exiftool.zip" exiftool)

          echo "${EXIFTOOL_VERSION}" > "$ASSETS/exiftool.version"
          ls -lh "$ASSETS"
          du -sh "$JNI"/*

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode signing keystore
        id: signing
        env:
          KS_B64: ${{ secrets.MF_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/metaforge.p12"
            echo "path=$RUNNER_TEMP/metaforge.p12" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no MF_KEYSTORE_B64 secret; release APK will be unsigned"
          fi

      - name: Build APKs
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.MF_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MF_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MF_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          set -euxo pipefail
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          # Almost every phone in use is arm64, and that build is half the size
          # of the universal one, so that is the file we put someone's name on.
          if [ -f dist/app-arm64-v8a-release.apk ]; then
            cp dist/app-arm64-v8a-release.apk "dist/MetaForge-${GITHUB_RUN_NUMBER}-arm64.apk"
          fi
          if [ -f dist/app-universal-release.apk ]; then
            cp dist/app-universal-release.apk "dist/MetaForge-${GITHUB_RUN_NUMBER}-universal.apk"
          fi
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: MetaForge-APK
          path: dist/*.apk
          retention-days: 90

      - name: Publish release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.1.${GITHUB_RUN_NUMBER}"
          NOTES=$(printf '%s\n' \
            "MetaForge build ${GITHUB_RUN_NUMBER}" \
            "" \
            "Install **MetaForge-${GITHUB_RUN_NUMBER}-arm64.apk**. That is the right" \
            "file for essentially every phone made in the last decade." \
            "" \
            "If it refuses to install, use MetaForge-${GITHUB_RUN_NUMBER}-universal.apk," \
            "which carries all three CPU builds and is twice the size." \
            "" \
            "ExifTool ${EXIFTOOL_VERSION} and Perl 5.38.2 run natively on the device.")
          gh release create "$TAG" dist/*.apk --title "MetaForge $TAG" --notes "$NOTES" --latest

      - name: Enable KVM
        if: inputs.run_emulator_test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Run engine tests on emulator
        if: inputs.run_emulator_test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_5
          ram-size: 4096M
          disk-size: 6G
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash ci/emulator-tests.sh

      - uses: actions/upload-artifact@v4
        if: always() && inputs.run_emulator_test
        with:
          name: engine-test-report
          path: app/build/reports/androidTests/**
          retention-days: 30

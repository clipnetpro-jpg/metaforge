name: 02 - Build APK

on:
  workflow_dispatch:
    inputs:
      run_emulator_test:
        description: 'Run on-device tests in an Android emulator'
        type: boolean
        default: true

env:
  EXIFTOOL_VERSION: '13.59'

jobs:
  perl:
    uses: ./.github/workflows/perl-android.yml

  apk:
    needs: perl
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: perl-*
          path: perlout

      - name: Fetch ExifTool
        run: |
          set -euxo pipefail
          # exiftool.org only hosts the current release; the GitHub mirror is versioned.
          curl -fsSL -o exiftool.tar.gz \
            "https://github.com/exiftool/exiftool/archive/refs/tags/${EXIFTOOL_VERSION}.tar.gz"
          tar -xzf exiftool.tar.gz
          mv "exiftool-${EXIFTOOL_VERSION}" exiftool-src
          test -f exiftool-src/exiftool
          test -d exiftool-src/lib/Image/ExifTool

      - name: Assemble native libs and assets
        run: |
          set -euxo pipefail
          JNI=app/src/main/jniLibs
          ASSETS=app/src/main/assets
          mkdir -p "$JNI" "$ASSETS"

          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "$JNI/$abi"
            cp "perlout/perl-$abi/jniLibs/libperl.so" "$JNI/$abi/libperl.so"
          done

          # The Perl library tree is identical across ABIs apart from Config*
          # and the arch directory, so ship one shared zip plus a tiny per-ABI zip.
          BASE=perlout/perl-arm64-v8a/perl5
          rm -rf staging && mkdir -p staging/perl5
          cp -a "$BASE/." staging/perl5/
          ARCHDIRS=$(find staging/perl5 -maxdepth 1 -type d -name '*-android*' -printf '%f\n' || true)
          rm -f staging/perl5/Config.pm staging/perl5/Config_heavy.pl
          for d in $ARCHDIRS; do rm -rf "staging/perl5/$d"; done
          # trim things ExifTool never loads
          rm -rf staging/perl5/unicore/TestProp.pl staging/perl5/CPAN staging/perl5/CPANPLUS \
                 staging/perl5/ExtUtils/CBuilder staging/perl5/TAP staging/perl5/Test2 \
                 staging/perl5/Test staging/perl5/pod 2>/dev/null || true
          (cd staging && zip -qr9 "../$ASSETS/perl5.zip" perl5)

          for abi in arm64-v8a armeabi-v7a x86_64; do
            rm -rf archstage && mkdir -p archstage/perl5
            SRC="perlout/perl-$abi/perl5"
            cp "$SRC/Config.pm" "$SRC/Config_heavy.pl" archstage/perl5/ 2>/dev/null || true
            for d in $(find "$SRC" -maxdepth 1 -type d -name '*-android*' -printf '%f\n' || true); do
              cp -a "$SRC/$d" archstage/perl5/
            done
            (cd archstage && zip -qr9 "../$ASSETS/perl5-$abi.zip" perl5)
          done

          rm -rf etstage && mkdir -p etstage/exiftool
          cp exiftool-src/exiftool etstage/exiftool/exiftool
          cp -a exiftool-src/lib etstage/exiftool/lib
          find etstage -name '*.pod' -delete
          (cd etstage && zip -qr9 "../$ASSETS/exiftool.zip" exiftool)

          echo "${EXIFTOOL_VERSION}" > "$ASSETS/exiftool.version"
          ls -lh "$ASSETS"
          du -sh "$JNI"/*

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Collect APKs
        run: |
          set -euxo pipefail
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: MetaForge-APK
          path: dist/*.apk
          retention-days: 90

      - name: Enable KVM
        if: inputs.run_emulator_test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Run engine tests on emulator
        if: inputs.run_emulator_test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_5
          ram-size: 4096M
          disk-size: 6G
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set +e
            gradle --no-daemon connectedDebugAndroidTest
            rc=$?
            echo "::group::instrumentation results"
            for f in $(find app/build/outputs/androidTest-results -name '*.xml' 2>/dev/null); do
              echo "----- $f -----"
              sed -e 's/&#10;/\n/g' "$f" | head -c 20000
            done
            echo "::endgroup::"
            echo "::group::logcat"
            adb logcat -d -v brief PerlRuntime:V ExifTool:V InpaintEngine:V AndroidRuntime:E System.err:V '*:S' | tail -n 200
            echo "::endgroup::"
            exit $rc

      - uses: actions/upload-artifact@v4
        if: always() && inputs.run_emulator_test
        with:
          name: engine-test-report
          path: app/build/reports/androidTests/**
          retention-days: 30

name: 01 - Build Perl for Android

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/perl-android.yml'
      - 'native/PINS'

env:
  PERL_VERSION: 5.38.2
  PERL_CROSS_VERSION: 1.5.2

jobs:
  build:
    name: perl / ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64-v8a,   triple: aarch64-linux-android,   clang: aarch64-linux-android,    qemu: qemu-aarch64-static, api: 26 }
          - { abi: armeabi-v7a, triple: arm-linux-androideabi,   clang: armv7a-linux-androideabi, qemu: qemu-arm-static,     api: 26 }
          - { abi: x86_64,      triple: x86_64-linux-android,    clang: x86_64-linux-android,     qemu: qemu-x86_64-static,  api: 26 }
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static file

      - name: Cache built Perl
        id: cache
        uses: actions/cache@v4
        with:
          path: out/${{ matrix.abi }}
          key: perl-${{ matrix.abi }}-${{ env.PERL_VERSION }}-${{ env.PERL_CROSS_VERSION }}-v5

      - name: Fetch sources
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          curl -fsSLO "https://www.cpan.org/src/5.0/perl-${PERL_VERSION}.tar.gz"
          curl -fsSLO "https://github.com/arsv/perl-cross/releases/download/${PERL_CROSS_VERSION}/perl-cross-${PERL_CROSS_VERSION}.tar.gz"
          tar -xzf "perl-${PERL_VERSION}.tar.gz"
          tar -xzf "perl-cross-${PERL_CROSS_VERSION}.tar.gz"
          cp -a "perl-cross-${PERL_CROSS_VERSION}/." "perl-${PERL_VERSION}/"

      - name: Configure and build (self-healing)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: perl-${{ env.PERL_VERSION }}
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export SYSROOT="$TOOLCHAIN/sysroot"
          export CC="$TOOLCHAIN/bin/${{ matrix.clang }}${{ matrix.api }}-clang"
          export CXX="$TOOLCHAIN/bin/${{ matrix.clang }}${{ matrix.api }}-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"   RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip" NM="$TOOLCHAIN/bin/llvm-nm"
          export READELF="$TOOLCHAIN/bin/llvm-readelf" OBJDUMP="$TOOLCHAIN/bin/llvm-objdump"
          export LD="$TOOLCHAIN/bin/ld.lld"
          echo "SYSROOT=$SYSROOT" >> "$GITHUB_ENV"
          echo "STRIP=$STRIP"     >> "$GITHUB_ENV"
          "$CC" --version

          # Calls Android's bionic libc does not provide at all.
          EXTRA="-Ud_cuserid -Ud_futimes -Ud_lchmod -Ud_sockatmark -Ud_crypt -Ud_getspnam"
          EXTRA="$EXTRA -Ud_msgctl -Ud_msgget -Ud_msgrcv -Ud_msgsnd"
          EXTRA="$EXTRA -Ud_semctl -Ud_semget -Ud_semop"
          EXTRA="$EXTRA -Ud_shmat -Ud_shmctl -Ud_shmdt -Ud_shmget"

          LAST_MISSING=""
          BUILT=0
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "::group::attempt $attempt"
            echo "EXTRA=$EXTRA"
            pwd; ls -la ./configure || true
            set -x
            ./configure \
              --target=${{ matrix.triple }} \
              --sysroot="$SYSROOT" \
              --prefix=/system/metaforge/perl \
              --all-static \
              -Dusedl=undef \
              -Duseshrplib=false \
              -Dcc="$CC" \
              --disable-mod=re,IPC/SysV,GDBM_File,NDBM_File,ODBM_File,DB_File \
              $EXTRA 2>&1 | tee configure.log | tail -n 25
            rc=${PIPESTATUS[0]}
            set +x
            if [ "$rc" != "0" ]; then
              echo "::error::configure exited $rc"
              tail -n 120 configure.log
              exit 1
            fi

            if make -j"$(nproc)" > build.log 2>&1; then
              echo "BUILD OK on attempt $attempt"; BUILT=1; echo "::endgroup::"; break
            fi

            echo "----- compile errors (attempt $attempt) -----"
            { grep -nE "error:|Error [0-9]" build.log | head -n 40; } || true
            echo "----- last 60 lines -----"
            tail -n 60 build.log || true

            MISSING=$({ grep -oP "call to undeclared function .\K[a-zA-Z_0-9]+" build.log \
                        || true; } | sort -u | tr '\n' ' ')
            echo "missing symbols: [$MISSING]"
            echo "::endgroup::"

            if [ -z "$MISSING" ] || [ "$MISSING" = "$LAST_MISSING" ]; then
              echo "::error::build failed and cannot be auto-healed"
              { grep -nE "error:" build.log | head -n 40; } || true
              exit 1
            fi
            LAST_MISSING="$MISSING"
            for f in $MISSING; do EXTRA="$EXTRA -Ud_$f"; done
            make clean > /dev/null 2>&1 || true
          done
          [ "$BUILT" = "1" ] && [ -f ./perl ] || { echo "::error::no perl binary produced"; exit 1; }
          echo "$EXTRA" > "$GITHUB_WORKSPACE/bionic-flags.txt"

      - name: Verify binary runs (qemu)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: perl-${{ env.PERL_VERSION }}
        run: |
          set -euxo pipefail
          file ./perl && ls -lh ./perl
          ${{ matrix.qemu }} -L "$SYSROOT" ./perl -e 'print "PERL OK $] on $^O\n"' \
            || echo "::warning::qemu smoke test failed; will verify on emulator"

      - name: Stage output
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: perl-${{ env.PERL_VERSION }}
        run: |
          set -euxo pipefail
          OUT="$GITHUB_WORKSPACE/out/${{ matrix.abi }}"
          rm -rf "$OUT"; mkdir -p "$OUT/jniLibs" "$OUT/perl5"
          cp ./perl "$OUT/jniLibs/libperl.so"
          "$STRIP" "$OUT/jniLibs/libperl.so"

          # Ship the build tree's own lib/ rather than `make install` output.
          # lib/ is the flat @INC the freshly built interpreter uses for its own
          # test suite: pure-Perl modules AND the .pm half of every statically
          # linked XS extension (POSIX, Fcntl, IO, Encode, List::Util...).
          # installperl drops those .pm files for a -Dusedl=undef build, which is
          # exactly what left ExifTool unable to load anything.
          cp -a ./lib/. "$OUT/perl5/"

          # A cross build links every extension into the interpreter but never
          # copies its .pm half anywhere: POSIX.pm, Fcntl.pm, IO.pm, Encode.pm
          # and friends stay behind in ext/, dist/ and cpan/. That is why every
          # APK so far shipped the object code for those modules and none of the
          # Perl that loads it. Lay them out at the paths @INC expects.
          python3 "$GITHUB_WORKSPACE/ci/harvest-perl-modules.py" "$OUT/perl5"

          # Static interpreter: the .a archives are already inside libperl.so.
          find "$OUT/perl5" -name '*.a' -delete
          find "$OUT/perl5" -name '*.bs' -delete
          find "$OUT/perl5" -name '*.pod' -delete
          find "$OUT/perl5" -type d -name 't' -prune -exec rm -rf {} + 2>/dev/null || true
          rm -rf "$OUT/perl5/pod" "$OUT/perl5/CPAN" "$OUT/perl5/CPANPLUS" \
                 "$OUT/perl5/TAP" "$OUT/perl5/Test2" "$OUT/perl5/Test" \
                 "$OUT/perl5/ExtUtils/CBuilder" "$OUT/perl5/unicore/TestProp.pl" \
                 "$OUT/perl5/CPAN.pm" "$OUT/perl5/Test.pm" "$OUT/perl5/Test2.pm"

          # Refuse to publish a tree ExifTool cannot run on.
          MISSING=""
          for m in Config.pm Config_heavy.pl Errno.pm strict.pm warnings.pm \
                   POSIX.pm Fcntl.pm IO.pm IO/File.pm File/Spec.pm Cwd.pm \
                   Encode.pm List/Util.pm Scalar/Util.pm Time/Local.pm \
                   Digest/MD5.pm Compress/Zlib.pm; do
            [ -f "$OUT/perl5/$m" ] || MISSING="$MISSING $m"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::staged perl tree is missing:$MISSING"
            for m in $MISSING; do
              echo "--- where $m actually lives ---"
              find . -name "$(basename "$m")" -not -path './out/*' 2>/dev/null | head -3
            done
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/bionic-flags.txt" "$OUT/" 2>/dev/null || true
          du -sh "$OUT" "$OUT/perl5"

      - uses: actions/upload-artifact@v4
        with:
          name: perl-${{ matrix.abi }}
          path: out/${{ matrix.abi }}
          retention-days: 90

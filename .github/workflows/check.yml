name: 00 - Check

# The APK pipeline takes half an hour and only runs when somebody presses a
# button, so a commit that does not even compile could sit on main unnoticed.
# This runs on every push and tells you within a few minutes.
#
# It deliberately does not fetch the Perl artifacts: those are runtime assets,
# nothing links against them, and leaving them out is what keeps this fast.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/check.yml'
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile app and tests
        run: ./gradlew --no-daemon assembleDebug compileDebugAndroidTestKotlin

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14
